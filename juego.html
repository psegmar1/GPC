<!DOCTYPE html>
<html lang="es">

<head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <meta charset="utf-8">
    <title>Juego GPC</title>
    <style>
        body {
            background-color: #000;
            margin: 0px;
            overflow: hidden;
        }
    </style>
</head>

<body>
    <div id="container"></div>
    <div id="crosshair" style="
    position: absolute;
    top: 50%;
    left: 50%;
    width: 20px;
    height: 20px;
    margin-left: -10px;
    margin-top: -10px;
    border: 2px solid red;
    border-radius: 50%;
    pointer-events: none;
    z-index: 10;
	"></div>

    <div style="
    position: absolute;
    top: 20px;
    left: 40px;
    display: flex;
    font-family: 'Courier New', monospace;
    text-shadow: 1px 1px 2px black;
">
        <div id="healthBars" style="
        display: flex;
        flex-direction: column;
        gap: 12px;
        z-index: 100;
    ">
            <div id="playerHealthContainer" style="
            width: 210px;
            height: 28px;
            background: #110000;
            border: 3px solid #800000;
            border-radius: 0;
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 8px #800000;
        ">
                <div id="playerHealthFill" style="
                height: 100%;
                width: 100%;
                background: linear-gradient(to right, #00ff00, #44ff44);
                transition: width 0.4s, background 0.4s;
            "></div>
                <div id="playerHealthText" style="
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                color: white;
                font-weight: bold;
                font-size: 15px;
                text-shadow: 1px 1px 3px black, 0 0 6px red;
                letter-spacing: 1px;
            ">100 / 100 HP 🧔‍♂️</div>
            </div>

            <div id="vehicleHealthContainer" style="
            width: 210px;
            height: 28px;
            background: #001100;
            border: 3px solid #006400;
            border-radius: 0;
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 8px #006400;
            display: none;
        ">
                <div id="vehicleHealthFill" style="
                height: 100%;
                width: 100%;
                background: linear-gradient(to right, #00ff00, #44ff44);
                transition: width 0.4s, background 0.4s;
            "></div>
                <div id="vehicleHealthText" style="
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                color: white;
                font-weight: bold;
                font-size: 15px;
                text-shadow: 1px 1px 3px black, 0 0 6px lime;
                letter-spacing: 1px;
            ">100 / 100 HP 🚗</div>
            </div>
        </div>

        <div id="statsPanel" style="
        margin-left: 15px;
        background: #0a0303;
        color: #ffaaaa;
        padding: 12px;
        border-radius: 0;
        font-size: 15px;
        z-index: 100;
        border: 3px solid #8b0000;
        box-shadow: 0 0 10px #8b0000;
        font-weight: bold;
    ">
            <div style="color: #ff5555; margin-bottom: 6px; letter-spacing: 1px;">🧟 Estadísticas</div>
            <div>Zombies muertos: <span id="zombiesKilled" style="color: #ffcc00;">0</span></div>
            <div>Tiempo: <span id="gameTime" style="color: #55ff55;">0s</span></div>
        </div>
    </div>

    <div id="vehicleRespawnUI" style="
    position: absolute;
    top: 70px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.7);
    color: #ff6666;
    padding: 10px 20px;
    border-radius: 8px;
    font-family: 'Courier New', monospace;
    font-weight: bold;
    font-size: 18px;
    text-align: center;
    display: none;
    border: 2px solid #ff3333;
    z-index: 100;
	"></div>

    <div id="interactionMsg" style="position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: yellow;
            font-size: 24px;
            font-weight: bold;
            display: none;
            text-shadow: 2px 2px 4px black;">
        Pulsa [ESPACIO] para subir
    </div>

    <script src="lib/dat.gui.min.js"></script>
    <script src="lib/three.min_r140.js"></script>
    <script src="lib/OrbitControls.js"></script>
    <script src="lib/tween_18.js"></script>
    <script src="lib/inflate.min.js"></script>
    <script src="lib/FBXLoader.js"></script>
    <script src="lib/stats.min.js"></script>
    <script src="lib/SkeletonUtils.js"></script>
    <script src="js/juego.js"></script>


</body>

</html>
